[project]
name = "budget-manager"
version = "0.1.0"
description = "CLI to record income and expenses interactively or by command, summarize them by month, and back up the data"
readme = "README.md"
authors = [
    { name = "Gabriel Deamond", email = "175671615+gadeamonda@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
budget = "budget_manager.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
